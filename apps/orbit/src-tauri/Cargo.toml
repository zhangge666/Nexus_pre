# 本文件定义 Orbit Tauri 2 桌面壳及其 nexus-core 依赖。

[package]
name = "orbit-app"
description = "Orbit 记忆中枢 Tauri 应用"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
name = "orbit_app_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-util = "0.3"
keyring = "3"
nexus-core = { path = "../../../crates/nexus-core" }
nexus-protocol = { path = "../../../crates/nexus-protocol" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-notification = "2"
tokio = { version = "1", features = ["sync", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSColor", "NSWindow"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }

[lints.rust]
missing_docs = "warn"
# macOS 仅通过 Tauri 暴露的原生窗口指针配置透明底板；其余工作区仍保持禁止 unsafe。
unsafe_code = "allow"
