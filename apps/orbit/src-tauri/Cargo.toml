# 本文件定义 Orbit Tauri 2 外壳，并隔离桌面本地服务与 Android 远程客户端依赖。

[package]
name = "orbit-app"
description = "Orbit 记忆中枢 Tauri 应用"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
name = "orbit_app_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-notification = "2"
tokio = { version = "1", features = ["sync", "time"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
base64 = "0.22"
blake3 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
keyring = "3"
# 本地数据库、嵌入与协议监听仅属于桌面运行时，移动构建不得链接这些依赖。
nexus-core = { path = "../../../crates/nexus-core", default-features = false }
nexus-protocol = { path = "../../../crates/nexus-protocol", default-features = false }
nexus-sync = { path = "../../../crates/nexus-sync" }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = "0.8"
uuid = { version = "1", features = ["v7"] }

[target.'cfg(target_os = "android")'.dependencies]
aes-gcm = "0.10"
base64 = "0.22"
blake3 = "1"
nexus-sync = { path = "../../../crates/nexus-sync" }
nexus-platform-mobile = { path = "../../../crates/platform/platform-mobile" }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = "0.8"
uuid = { version = "1", features = ["v7"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSColor", "NSView", "NSWindow", "objc2-quartz-core"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["CALayer", "objc2-core-foundation"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }

[lints.rust]
missing_docs = "warn"
# macOS 仅通过 Tauri 暴露的原生窗口指针配置透明底板；其余工作区仍保持禁止 unsafe。
unsafe_code = "allow"
