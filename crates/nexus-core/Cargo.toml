# 本文件定义共享记忆核心 crate 的包信息与统一 lint 配置。

[package]
name = "nexus-core"
description = "Nexus 统一记忆模型、存储、写入与检索核心"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
# 保持桌面与既有核心使用者默认拥有本地嵌入；移动入口通过 default-features=false 保持轻量。
default = ["local-onnx"]
local-onnx = ["nexus-ai/local-onnx"]

[dependencies]
argon2 = "0.5"
base64 = "0.22"
bip39 = "2"
blake3 = "1"
chacha20poly1305 = "0.10"
nexus-sqlite-vec = { path = "../nexus-sqlite-vec" }
nexus-ai = { path = "../nexus-ai", default-features = false }
rand_core = { version = "0.6", features = ["getrandom"] }
ring = "0.17"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v7"] }
zeroize = { version = "1", features = ["derive"] }

[lints]
workspace = true
