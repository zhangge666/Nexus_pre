# 本文件定义 Memory Protocol 服务 crate 及其核心依赖。

[package]
name = "nexus-protocol"
description = "Nexus Memory Protocol 定义与本地服务"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
axum = "0.8"
fs2 = "0.4"
futures-util = "0.3"
nexus-ai = { path = "../nexus-ai" }
nexus-core = { path = "../nexus-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["net", "sync", "rt"] }
tokio-stream = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
